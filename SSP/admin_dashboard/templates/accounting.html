<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIO SPARK Admin Dashboard | Accounting</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; background: #f4f4f4; color: #1a1a1a; }

        header {
            background: #000;
            color: #fff;
            padding: 20px 32px;
        }
        header h1 { font-size: 22px; font-weight: 400; }

        main { max-width: 720px; margin: 32px auto; padding: 0 24px; }

        .filters { display: flex; gap: 10px; margin-bottom: 20px; }
        .filter-btn {
            background: #fff;
            border: 2px solid #ccc;
            border-radius: 10px;
            padding: 10px 18px;
            font-size: 15px;
            cursor: pointer;
        }
        .filter-btn.active { background: #000; color: #fff; border-color: #000; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .1);
        }
        th, td { text-align: left; padding: 14px 18px; }
        th { background: #eee; font-weight: 600; font-size: 14px; }
        tbody tr:not(:last-child) td { border-bottom: 1px solid #eee; }
        td.source { text-transform: capitalize; }
        td.numeric, th.numeric { text-align: right; }

        .chart-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .1);
            padding: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
<header><h1>Accounting</h1></header>

<main>
    <div class="filters">
        <button class="filter-btn active" data-range="today">Today</button>
        <button class="filter-btn" data-range="week">Week</button>
        <button class="filter-btn" data-range="month">Month</button>
        <button class="filter-btn" data-range="all">All Time</button>
    </div>

    <div class="chart-card">
        <canvas id="source-chart" height="220"></canvas>
    </div>

    <table>
        <thead>
            <tr>
                <th>Source</th>
                <th class="numeric">Revenue</th>
                <th class="numeric">Transactions</th>
            </tr>
        </thead>
        <tbody id="summary-body">
            {% for row in sources %}
            <tr>
                <td class="source">{{ row.source }}</td>
                <td class="numeric">₱{{ "%.2f"|format(row.revenue) }}</td>
                <td class="numeric">{{ row.transaction_count }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</main>

<!-- Vendored locally (issue #16) — no CDN fetch, since this is a
     local-first, possibly-offline surface. Served from the dashboard's own
     static files (admin_dashboard/main.py's /static mount). -->
<script src="/static/js/chart.umd.min.js"></script>
<script>
    const initialSources = {{ sources_json | safe }};
    let sourceChart;

    function renderRows(sources) {
        const tbody = document.getElementById("summary-body");
        tbody.innerHTML = "";
        sources.forEach((row) => {
            const tr = document.createElement("tr");

            const sourceCell = document.createElement("td");
            sourceCell.className = "source";
            sourceCell.textContent = row.source;

            const revenueCell = document.createElement("td");
            revenueCell.className = "numeric";
            revenueCell.textContent = "₱" + row.revenue.toFixed(2);

            const countCell = document.createElement("td");
            countCell.className = "numeric";
            countCell.textContent = row.transaction_count;

            tr.append(sourceCell, revenueCell, countCell);
            tbody.appendChild(tr);
        });
    }

    function renderChart(sources) {
        const labels = sources.map((row) => row.source);
        const revenue = sources.map((row) => row.revenue);
        const counts = sources.map((row) => row.transaction_count);

        if (sourceChart) {
            sourceChart.data.labels = labels;
            sourceChart.data.datasets[0].data = revenue;
            sourceChart.data.datasets[1].data = counts;
            sourceChart.update();
            return;
        }

        sourceChart = new Chart(document.getElementById("source-chart"), {
            type: "bar",
            data: {
                labels,
                datasets: [
                    { label: "Revenue (₱)", data: revenue, backgroundColor: "#000", yAxisID: "y" },
                    { label: "Transactions", data: counts, backgroundColor: "#999", yAxisID: "y1" },
                ],
            },
            options: {
                responsive: true,
                scales: {
                    y: { beginAtZero: true, position: "left" },
                    y1: { beginAtZero: true, position: "right", grid: { drawOnChartArea: false } },
                },
            },
        });
    }

    async function loadRange(range) {
        const response = await fetch(`/accounting/data?range=${range}`);
        if (!response.ok) return;
        const data = await response.json();
        renderRows(data.sources);
        renderChart(data.sources);

        document.querySelectorAll(".filter-btn").forEach((btn) => {
            btn.classList.toggle("active", btn.dataset.range === range);
        });
    }

    document.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => loadRange(btn.dataset.range));
    });

    renderChart(initialSources);
</script>
</body>
</html>
