<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIO SPARK Admin Dashboard | Sign In</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; background: #f4f4f4; color: #1a1a1a; }

        header {
            background: #000;
            color: #fff;
            padding: 20px 32px;
        }
        header h1 { font-size: 22px; font-weight: 400; }

        main { max-width: 380px; margin: 48px auto; padding: 0 24px; }

        form {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .1);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        label { font-size: 14px; font-weight: 600; display: flex; flex-direction: column; gap: 6px; }
        input {
            font-size: 15px;
            padding: 10px 12px;
            border: 2px solid #ccc;
            border-radius: 10px;
        }
        input:focus { outline: none; border-color: #000; }
        button {
            background: #000;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 15px;
            cursor: pointer;
        }
        button:disabled { opacity: .6; cursor: default; }
        .error { color: #b00020; font-size: 14px; min-height: 18px; }
    </style>
</head>

<body>
<header><h1>Sign In</h1></header>

<main>
    <form id="login-form">
        <label>Username
            <input name="username" autocomplete="username" required autofocus>
        </label>
        <label>Password
            <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <p class="error" id="login-error" role="alert"></p>
        <button type="submit">Sign in</button>
    </form>
</main>

<script>
    // POST /login takes JSON (not form-encoded), so the form submits via fetch.
    // On success the response sets the session cookie and we go to the dashboard.
    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("login-error");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = form.querySelector("button");
        button.disabled = true;
        errorEl.textContent = "";

        try {
            const response = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: form.username.value,
                    password: form.password.value,
                }),
            });
            if (response.ok) {
                window.location.href = "/accounting";
                return;
            }
            const data = await response.json().catch(() => ({}));
            errorEl.textContent = data.detail || "Sign in failed";
        } catch {
            errorEl.textContent = "Could not reach the dashboard server";
        }
        button.disabled = false;
    });
</script>
</body>
</html>
