<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIO SPARK | Your Scan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #fff; }
        .page-wrapper, .background-overlay { min-height: 100vh; }

        .card { width: 100%; background: #fff; animation: fadeUp .6s; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; }
        }

        header {
            display: flex;
            justify-content: center;
            padding: 16px 24px;
            border-bottom: 1px solid #e5e5e5;
        }
        header img { width: 100%; max-width: 600px; }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 32px 24px;
        }

        h1 { font-size: 30px; font-weight: 400; margin-bottom: 18px; }

        .file-list {
            list-style: none;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 26px;
            text-align: left;
        }
        .file-list li {
            background: #f4f4f4;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 8px;
            font-size: 15px;
        }

        form.action-form {
            width: 100%;
            max-width: 360px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input[type=email] {
            width: 100%;
            font-size: 18px;
            padding: 14px;
            border: 2px solid #ccc;
            border-radius: 10px;
            margin-bottom: 14px;
        }

        button {
            background: #000;
            color: #fff;
            border: none;
            border-radius: 14px;
            width: 100%;
            padding: 18px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
        }
        button.download { background: #2E7D32; }
        button.download:hover { background: #256B2A; }

        .error-banner {
            background: #fff0f0;
            border: 1px solid #ffcccc;
            color: #cc0000;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            text-align: center;
            max-width: 400px;
        }
        .success-banner {
            background: #f0fff4;
            border: 1px solid #b7ebc6;
            color: #256B2A;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            text-align: center;
            max-width: 400px;
        }

        @media (min-width: 900px) {
            body {
                background:
                    linear-gradient(rgba(0, 80, 35, .78), rgba(0, 80, 35, .78)),
                    url("/static/usc_building.jpg");
                background-size: cover;
                background-position: center;
                background-attachment: fixed;
            }
            .background-overlay {
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 50px;
            }
            .card {
                width: 600px;
                border-radius: 20px;
                overflow: hidden;
                box-shadow: 0 25px 80px rgba(0, 0, 0, .35);
            }
        }
    </style>
</head>

<body>
<div class="page-wrapper">
    <div class="background-overlay">
        <div class="card">
            <header><img src="/static/image.png" alt="USC Logo"></header>
            <main>
                <h1>Your Scanned Document</h1>

                {% if error %}
                <div class="error-banner">⚠️ {{ error }}</div>
                {% endif %}
                {% if sent_to %}
                <div class="success-banner">✅ Sent to {{ sent_to }}</div>
                {% endif %}

                <ul class="file-list">
                    {% for f in files %}
                    <li><i class="fa-solid fa-file-pdf"></i> {{ f.original_filename or f.path.split('/')[-1] }}</li>
                    {% endfor %}
                </ul>

                <form class="action-form" method="POST" action="/redeem/download">
                    <input type="hidden" name="session_id" value="{{ session_id }}">
                    <input type="hidden" name="otp" value="{{ otp }}">
                    <button type="submit" class="download">
                        Download PDF <i class="fa-solid fa-download"></i>
                    </button>
                </form>

                <form class="action-form" method="POST" action="/redeem/email">
                    <input type="hidden" name="session_id" value="{{ session_id }}">
                    <input type="hidden" name="otp" value="{{ otp }}">
                    <input type="email" name="recipient" placeholder="your@email.com" required>
                    <button type="submit">
                        Email Me This PDF <i class="fa-solid fa-envelope"></i>
                    </button>
                </form>
            </main>
        </div>
    </div>
</div>
</body>
</html>
